# 운영 예시: 앱 + Caddy(자동 HTTPS). 모바일 브라우저는 HTTPS 에서만 마이크를 허용한다.
services:
  app:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /app/data
      TRUST_PROXY: "true"   # Caddy 뒤에서 실제 클라이언트 IP로 속도 제한
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
