# GitHub Projects(v2) 아이템 관리
# https://github.com/users/gionty0805/projects/2
#
# 준비: 저장소 Settings → Secrets and variables → Actions 에 PROJECT_TOKEN 등록
#   - classic PAT: `project` 스코프 (+ 비공개 저장소 이슈를 추가하려면 `repo`)
#   - fine-grained PAT: Account permissions → Projects: Read and write
#                       (+ Repository permissions → Issues/Pull requests: Read)
name: Project items

on:
  workflow_dispatch:
    inputs:
      action:
        description: 작업
        type: choice
        required: true
        default: list
        options: [list, create, add-issue, update, archive, unarchive, delete]
      item_id:
        description: "프로젝트 아이템 ID (PVTI_...) — update / archive / unarchive / delete"
        required: false
      issue_number:
        description: "이 저장소의 이슈·PR 번호 — add-issue"
        required: false
      title:
        description: "제목 — create(필수) / update(드래프트만)"
        required: false
      body:
        description: "본문 — create / update(드래프트만)"
        required: false
      fields:
        description: 'JSON으로 필드 값 지정, 빈 문자열은 비움. 예: {"Status":"In Progress","Priority":"High"}'
        required: false
      include_archived:
        description: "list에서 보관된 아이템도 표시"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: project-items
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Check token
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$PROJECT_TOKEN" ]; then
            echo "::error::PROJECT_TOKEN 시크릿이 없습니다. project 권한이 있는 PAT를 등록하세요."
            exit 1
          fi

      - name: Run
        uses: actions/github-script@v7
        env:
          PROJECT_OWNER: gionty0805
          PROJECT_OWNER_TYPE: user
          PROJECT_NUMBER: "2"
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_ITEM_ID: ${{ inputs.item_id }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_BODY: ${{ inputs.body }}
          INPUT_FIELDS: ${{ inputs.fields }}
          INPUT_INCLUDE_ARCHIVED: ${{ inputs.include_archived }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const run = require('./.github/scripts/project-items.cjs');
            await run({ github, context, core });
